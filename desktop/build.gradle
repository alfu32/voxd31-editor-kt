def configureBundleZipTask = { String name, String osLabel, String fetchTaskName, File jdkCache, boolean includeUnixLauncher, boolean includeWindowsScripts ->
    tasks.register(name, Zip) {
        dependsOn "jar", fetchTaskName, "generateUnixLauncher", "generateUnixJreLauncher",
            "generateWindowsLauncher", "generateWindowsJreLauncher", "generateWindowsInstall"
        destinationDirectory.set(rootProject.file("dist"))
        archiveFileName.set("${appName}-dist-${bundleVersion}-${osLabel}.zip")
        from(tasks.named("jar").flatMap { it.archiveFile }) {
            rename { "voxcraft-editor.jar" }
        }
        baseBundleFiles.delegate = delegate
        baseBundleFiles()
        from({ resolveJdkRoot(jdkCache) }) {
            into("jre")
            exclude("*.zip", "*.tar.gz", "*.tar")
        }
        if (includeUnixLauncher) {
            from(file("$launcherDir/voxcraft"))
            from(file("$launcherDir/voxcraft-jre"))
        }
        if (includeWindowsScripts) {
            from(file("$launcherDir/voxcraft.cmd"))
            from(file("$launcherDir/voxcraft-jre.cmd"))
            from(file("$launcherDir/voxcraft.install.cmd"))
        }
    }
}

def configureBundleTarTask = { String name, String osLabel, String fetchTaskName, File jdkCache ->
    tasks.register(name, Tar) {
        dependsOn "jar", fetchTaskName, "generateUnixLauncher", "generateUnixJreLauncher"
        destinationDirectory.set(rootProject.file("dist"))
        archiveFileName.set("${appName}-dist-${bundleVersion}-${osLabel}.tar.gz")
        compression = Compression.GZIP
        from(tasks.named("jar").flatMap { it.archiveFile }) {
            rename { "voxcraft-editor.jar" }
        }
        baseBundleFiles.delegate = delegate
        baseBundleFiles()
        from({ resolveJdkRoot(jdkCache) }) {
            into("jre")
            exclude("*.zip", "*.tar.gz", "*.tar")
        }
        from(file("$launcherDir/voxcraft"))
        from(file("$launcherDir/voxcraft-jre"))
    }
}

def configureBundleDirTask = { String name, String osLabel, String fetchTaskName, File jdkCache, boolean includeUnixLauncher, boolean includeWindowsScripts ->
    tasks.register(name, Sync) {
        dependsOn "jar", fetchTaskName, "generateUnixLauncher", "generateUnixJreLauncher",
            "generateWindowsLauncher", "generateWindowsJreLauncher", "generateWindowsInstall"
        into(rootProject.file("dist/${appName}-dist-${bundleVersion}-${osLabel}"))
        from(tasks.named("jar").flatMap { it.archiveFile }) {
            rename { "voxcraft-editor.jar" }
        }
        baseBundleFiles.delegate = delegate
        baseBundleFiles()
        from({ resolveJdkRoot(jdkCache) }) {
            into("jre")
            exclude("*.zip", "*.tar.gz", "*.tar")
        }
        if (includeUnixLauncher) {
            from(file("$launcherDir/voxcraft"))
            from(file("$launcherDir/voxcraft-jre"))
        }
        if (includeWindowsScripts) {
            from(file("$launcherDir/voxcraft.cmd"))
            from(file("$launcherDir/voxcraft-jre.cmd"))
            from(file("$launcherDir/voxcraft.install.cmd"))
        }
        doLast {
            if (includeUnixLauncher) {
                ensureUnixRuntimeExecutables(destinationDir)
            }
        }
    }
}


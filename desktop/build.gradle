def configureFatJarTask = { Jar jarTask, String archiveName, List<String> extraExcludes ->
    jarTask.archiveFileName.set(archiveName)
    jarTask.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    jarTask.dependsOn configurations.runtimeClasspath
    jarTask.from(sourceSets.main.output)
    jarTask.from {
        configurations.runtimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    jarTask.exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    extraExcludes.each { jarTask.exclude(it) }
    jarTask.manifest {
        attributes 'Main-Class': application.mainClass.get(), 'Enable-Native-Access': 'ALL-UNNAMED'
    }
    jarTask.doLast {
        archiveFile.get().asFile.setExecutable(true, false)
    }
}

tasks.named('jar', Jar).configure {
    configureFatJarTask(delegate, "${appName}-${projectVersion}.jar", [])
}


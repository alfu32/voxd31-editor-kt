    linuxX64: project.findProperty("bundleJdkLinuxUrl") ?: "${temurinBase}/OpenJDK21U-jre_x64_linux_hotspot_${bundleJdkSuffix}.tar.gz",
    winX64  : project.findProperty("bundleJdkWinUrl") ?: "${temurinBase}/OpenJDK21U-jre_x64_windows_hotspot_${bundleJdkSuffix}.zip",
    macArm64: project.findProperty("bundleJdkMacArmUrl") ?: "${temurinBase}/OpenJDK21U-jre_aarch64_mac_hotspot_${bundleJdkSuffix}.tar.gz"
]


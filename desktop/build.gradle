def resolveJdkRoot = { File cacheDir ->
    if (!cacheDir.exists()) {
        return cacheDir
    }
    def candidates = cacheDir.listFiles()?.findAll { it.isDirectory() } ?: []
    if (candidates.size() == 1) {
        return candidates.first()
    }
    def javaFiles = project.fileTree(cacheDir) {
        include "**/bin/java"
        include "**/bin/java.exe"
        include "**/Contents/Home/bin/java"
    }.files
    if (!javaFiles.isEmpty()) {
        def best = javaFiles.min { it.absolutePath.length() }
        def path = best.absolutePath.replace("\\", "/")
        if (path.endsWith("/Contents/Home/bin/java")) {
            return best.parentFile.parentFile.parentFile.parentFile
        }
        return best.parentFile.parentFile
    }
    def direct = candidates.find {
        new File(it, "bin/java").exists() ||
            new File(it, "bin/java.exe").exists() ||
            new File(it, "Contents/Home/bin/java").exists()
    }
    return direct ?: cacheDir
}

def downloadAndExtractJdk = { String url, File cacheDir ->
    if (cacheDir.exists() && cacheDir.listFiles()?.length > 0) {
        return
    }
    cacheDir.mkdirs()
    def archiveName = url.tokenize('/').last()
    def archiveFile = new File(cacheDir, archiveName)
    if (!archiveFile.exists()) {
        ant.get(src: url, dest: archiveFile, skipexisting: true, verbose: true)
    }
    if (archiveName.endsWith(".zip")) {
        ant.unzip(src: archiveFile, dest: cacheDir)
    } else if (archiveName.endsWith(".tar.gz")) {
        ant.untar(src: archiveFile, dest: cacheDir, compression: "gzip")
    } else {
        throw new GradleException("Unsupported JDK archive: ${archiveName}")
    }
}

def createUnixLauncher = { File outFile ->
    outFile.parentFile.mkdirs()
    outFile.text = """#!/bin/bash
set -euo pipefail
INSTALL_PATH="\$(cd "\$(dirname "\$0")" && pwd)"
DEFAULT_JAVA_OPTS=(${packagedJvmArgs.collect { "\"${it}\"" }.join(' ')})
if [[ -n "\${VOXCRAFT_JAVA_OPTS:-}" ]]; then
  # shellcheck disable=SC2206
  JAVA_OPTS=(\${VOXCRAFT_JAVA_OPTS})
else
  JAVA_OPTS=("\${DEFAULT_JAVA_OPTS[@]}")
fi
exec java "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/voxcraft-editor.jar" "\$@"
"""
}

def createUnixJreLauncher = { File outFile ->
    outFile.parentFile.mkdirs()
    outFile.text = """#!/bin/bash
set -euo pipefail
INSTALL_PATH="\$(cd "\$(dirname "\$0")" && pwd)"
JAVA_BIN="\$INSTALL_PATH/jre/bin/java"
if [[ ! -x "\$JAVA_BIN" && -x "\$INSTALL_PATH/jre/Contents/Home/bin/java" ]]; then
  JAVA_BIN="\$INSTALL_PATH/jre/Contents/Home/bin/java"
fi
if [[ ! -x "\$JAVA_BIN" ]]; then
  echo "Bundled Java not found at \$JAVA_BIN" >&2
  exit 1
fi
DEFAULT_JAVA_OPTS=(${packagedJvmArgs.collect { "\"${it}\"" }.join(' ')})
if [[ -n "\${VOXCRAFT_JAVA_OPTS:-}" ]]; then
  # shellcheck disable=SC2206
  JAVA_OPTS=(\${VOXCRAFT_JAVA_OPTS})
else
  JAVA_OPTS=("\${DEFAULT_JAVA_OPTS[@]}")
fi
exec "\$JAVA_BIN" "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/voxcraft-editor.jar" "\$@"
"""
}

def createWindowsLauncher = { File outFile ->
    outFile.parentFile.mkdirs()
    outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"
set "JAVA_OPTS=-Xms512m -Xmx2g"
if not "%VOXCRAFT_JAVA_OPTS%"=="" set "JAVA_OPTS=%VOXCRAFT_JAVA_OPTS%"
if "%~1"=="" (
  java %JAVA_OPTS% -jar "%APP_DIR%\\voxcraft-editor.jar"
  exit /b %ERRORLEVEL%
)
java %JAVA_OPTS% -jar "%APP_DIR%\\voxcraft-editor.jar" %*
exit /b %ERRORLEVEL%
"""
}

def createWindowsJreLauncher = { File outFile ->
    outFile.parentFile.mkdirs()
    outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"
set "JAVA_BIN=%APP_DIR%\\jre\\bin\\java.exe"
if not exist "%JAVA_BIN%" (
  echo Bundled Java not found at %JAVA_BIN%
  exit /b 1
)
set "JAVA_OPTS=-Xms512m -Xmx2g"
if not "%VOXCRAFT_JAVA_OPTS%"=="" set "JAVA_OPTS=%VOXCRAFT_JAVA_OPTS%"
if "%~1"=="" (
  "%JAVA_BIN%" %JAVA_OPTS% -jar "%APP_DIR%\\voxcraft-editor.jar"
  exit /b %ERRORLEVEL%
)
"%JAVA_BIN%" %JAVA_OPTS% -jar "%APP_DIR%\\voxcraft-editor.jar" %*
exit /b %ERRORLEVEL%
"""
}

def createWindowsInstall = { File outFile ->
    outFile.parentFile.mkdirs()
    outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"

echo Registering Voxcraft path: %APP_DIR%
setx PATH "%PATH%;%APP_DIR%" >nul

echo Registering .vxdi file association...
reg add "HKCU\\Software\\Classes\\.vxdi" /ve /d "VoxcraftFile" /f >nul
reg add "HKCU\\Software\\Classes\\VoxcraftFile" /ve /d "voxcraft File" /f >nul
reg add "HKCU\\Software\\Classes\\VoxcraftFile\\shell\\open\\command" /ve /d "\\"%APP_DIR%\\voxcraft.cmd\\" \\"%%1\\"" /f >nul

echo Done. You may need to restart your shell for PATH changes to apply.
pause
"""
}

def ensureUnixRuntimeExecutables = { File installDir ->
    ["voxcraft", "voxcraft-jre"].each { name ->
        def launcher = new File(installDir, name)
        if (launcher.exists()) {
            launcher.setExecutable(true, false)
            launcher.setReadable(true, false)
        }
    }
    def javaBinDir = new File(installDir, "jre/bin")
    if (javaBinDir.exists()) {
        javaBinDir.eachFileRecurse { file ->
            if (file.isFile()) {
                file.setExecutable(true, false)
                file.setReadable(true, false)
            }
        }
    }
    ["jre/lib/jspawnhelper", "jre/lib/jexec"].each { relPath ->
        def helper = new File(installDir, relPath)
        if (helper.exists()) {
            helper.setExecutable(true, false)
            helper.setReadable(true, false)
        }
    }
}


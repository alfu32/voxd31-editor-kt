def bundleJdkVersion = (project.findProperty("bundleJdkVersion") ?: "21.0.9+10").toString()
def bundleJdkTag = bundleJdkVersion.replace("+", "%2B")
def bundleJdkSuffix = bundleJdkVersion.replace("+", "_")

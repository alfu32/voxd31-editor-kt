<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body { margin: 0; height: 100%; background: #dde6f4; font: 14px/1.4 sans-serif; }

  <header>

</html>

def resolveGitTag = {
    try {
        def process = new ProcessBuilder("git", "describe", "--tags", "--abbrev=0")
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream.text.trim()
        def code = process.waitFor()
        if (code != 0) {
            return null
        }
        return output ? output : null
    } catch (Exception ignored) {
        return null
    }
}

def bundleVersion = (
    project.findProperty("releaseNumber")
        ?: resolveGitTag()
        ?: project.findProperty("projectVersion")
        ?: "1.0.0"
).toString()

ext.bundleVersion = bundleVersion
ext.projectVersion = bundleVersion

allprojects {
    version = bundleVersion
    ext.projectVersion = bundleVersion
}

tasks.register('generateAssetList') {
    File assetsFolder = file("${project.rootDir}/assets")
    File assetsFile = new File(assetsFolder, "assets.txt")
    inputs.dir(assetsFolder)
    outputs.file(assetsFile)

    doLast {
        def entries = fileTree(assetsFolder) {
            exclude "assets.txt"
        }.files.collect { asset ->
            assetsFolder.toPath().relativize(asset.toPath()).toString().replace('\\', '/')
        }.sort()

        assetsFile.text = entries.isEmpty() ? "" : entries.join("\n") + "\n"
    }
}

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        google()
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"
    }
}

allprojects {
    apply plugin: "eclipse"
    apply plugin: "idea"

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
        maven { url "https://jitpack.io" }
        maven { url "https://maven.enginehub.org/repo/" }
    }

    idea {
        module {
            outputDir = file('build/classes/java/main')
            testOutputDir = file('build/classes/java/test')
        }
    }
}

configure(subprojects.findAll { !['android', 'web'].contains(it.name) }) {
    apply plugin: "java-library"
    apply plugin: "kotlin"

    def compatVersion = (project.findProperty('javaCompatVersion') ?: '17').toString()
    java.sourceCompatibility = JavaVersion.toVersion(compatVersion)
    java.targetCompatibility = JavaVersion.toVersion(compatVersion)
    tasks.named('processResources').configure {
        dependsOn rootProject.tasks.named('generateAssetList')
    }

    tasks.named('compileJava').configure {
        options.incremental = true
        if (JavaVersion.current().isJava9Compatible()) {
            options.release.set(Integer.parseInt(compatVersion))
        }
    }

    tasks.named('compileKotlin').configure {
        compilerOptions.jvmTarget.set(
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(compatVersion)
        )
    }
    tasks.named('compileTestKotlin').configure {
        compilerOptions.jvmTarget.set(
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(compatVersion)
        )
    }
}

